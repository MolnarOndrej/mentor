<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mentor · Denní zpětná vazba</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>
          <a href="#/overview" id="home-link">Mentor<span>.</span></a>
        </h1>
        <nav aria-label="Hlavní navigace">
          <a
            href="#/overview"
            id="open-overview"
            class="secondary nav-link"
            data-page="overview"
            aria-current="page"
            title="Přehled"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8" />
            </svg>
            <span>Přehled</span>
          </a>
          <a
            href="#/settings"
            data-page="settings"
            id="open-settings"
            class="secondary nav-link"
            aria-label="Nastavení"
            title="Nastavení"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M10 2h4l.6 3 2.1 1.2 2.9-.9 2 3.4-2.3 2v2.6l2.3 2-2 3.4-2.9-.9-2.1 1.2-.6 3h-4l-.6-3-2.1-1.2-2.9.9-2-3.4 2.3-2v-2.6l-2.3-2 2-3.4 2.9.9L9.4 5z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Nastavení</span>
          </a>
          <a
            href="#/prompt"
            data-page="prompt"
            id="open-prompt"
            class="secondary nav-link"
            aria-label="Instrukce kouče"
            title="Instrukce kouče"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M14 3H5v18h14v-9M8 8h3M8 12h3M8 16h7M15 7l2 2 5-5-2-2z" />
            </svg>
            <span>Instrukce kouče</span>
          </a>
          <a
            href="#/archive"
            data-page="archive"
            id="open-archive"
            class="secondary nav-link"
            aria-label="Archiv"
            title="Archiv"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 3h18v5H3zM5 8v13h14V8M9 12h6" />
            </svg>
            <span>Archiv</span>
          </a>
        </nav>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="overview-page" data-view="overview">
        <section class="import">
          <form id="import-form">
            <label for="url">Přidat konverzaci</label>
            <div class="input-row">
              <input
                id="url"
                type="url"
                required
                placeholder="Vložte sdílený odkaz na konverzaci"
              /><button type="submit" class="icon-button" aria-label="Přidat" title="Přidat">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
            </div>
          </form>
          <div id="import-status"></div>
        </section>
        <section class="current">
          <div class="section-head">
            <div>
              <h2 id="report-heading">Dnešní rozbor</h2>
              <span id="report-date" class="hint"></span>
            </div>
            <div class="actions">
              <button id="back-today" class="secondary" hidden>Dnes</button
              ><button
                id="refresh-today"
                class="secondary icon-button"
                aria-label="Aktualizovat konverzace"
                title="Aktualizovat konverzace"
                disabled
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M20 4v6h-6 M20 10a8 8 0 1 0-2 8" />
                </svg></button
              ><button
                id="analyze"
                class="icon-button"
                aria-label="Analyzovat"
                title="Analyzovat"
                disabled
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="m14 3 1.8 5.2L21 10l-5.2 1.8L14 17l-1.8-5.2L7 10l5.2-1.8zM5 14l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div id="current-report"></div>
          <details id="day-conversations">
            <summary id="day-conversations-heading">Konverzace dne</summary>
            <div id="current-conversations"></div>
          </details>
        </section>
      </div>
      <section
        id="runtime-settings-page"
        data-view="settings"
        aria-labelledby="runtime-settings-heading"
        hidden
      >
        <h2 id="runtime-settings-heading">Nastavení</h2>
        <form id="runtime-settings-form">
          <label for="poll-interval">Interval pollování (sekundy)</label>
          <input id="poll-interval" type="number" min="1" max="3600" step="1" required disabled />
          <label for="daily-time">Čas automatického rozboru</label>
          <input id="daily-time" type="time" step="60" required disabled />
          <p id="runtime-settings-error" class="error" role="alert"></p>
        </form>
      </section>
      <section id="prompt-page" data-view="prompt" aria-labelledby="prompt-heading" hidden>
        <h2 id="prompt-heading">Instrukce kouče</h2>
        <form id="prompt-form">
          <label for="prompt" class="sr-only">Instrukce kouče</label
          ><textarea id="prompt" rows="22" maxlength="20000" required disabled></textarea>
          <p id="prompt-error" class="error" role="alert"></p>
        </form>
      </section>
      <section id="archive-page" data-view="archive" aria-labelledby="archive-heading" hidden>
        <div class="section-head archive-heading">
          <h2 id="archive-heading">Archiv</h2>
          <div class="archive-day-picker">
            <label for="day">Otevřít den</label><input id="day" type="date" />
          </div>
        </div>
        <div id="archive"></div>
      </section>
    </main>
    <dialog
      id="regenerate-analysis-dialog"
      aria-labelledby="regenerate-analysis-title"
      aria-describedby="regenerate-analysis-description"
    >
      <h2 id="regenerate-analysis-title">Přegenerovat rozbor?</h2>
      <p id="regenerate-analysis-description">
        Po úspěšném dokončení nový rozbor nahradí stávající rozbor. Jeho dosavadní diskuse se
        odstraní a nový rozbor začne bez diskuse.
      </p>
      <form method="dialog" class="actions">
        <button value="cancel" class="secondary" autofocus>Zrušit</button>
        <button value="regenerate">Přegenerovat</button>
      </form>
    </dialog>
    <dialog id="delete-conversation-dialog" aria-labelledby="delete-conversation-description">
      <p id="delete-conversation-description"></p>
      <form method="dialog" class="actions">
        <button value="cancel" class="secondary" autofocus>Zrušit</button>
        <button value="delete">Odstranit</button>
      </form>
    </dialog>
    <dialog id="conversation-dialog" aria-labelledby="conversation-title">
      <div class="conversation-dialog-heading">
        <h2 id="conversation-title"></h2>
        <div class="conversation-dialog-controls">
          <div id="conversation-dialog-actions"></div>
          <button
            id="close-conversation"
            class="secondary close"
            aria-label="Zavřít"
            title="Zavřít"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m6 6 12 12M6 18 18 6" />
            </svg>
          </button>
        </div>
      </div>
      <div id="conversation-content"></div>
    </dialog>
    <dialog id="prompt-dialog">
      <button id="close-prompt" class="secondary close" aria-label="Zavřít" title="Zavřít">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
      </button>
      <h2 id="prompt-title">Úplný prompt</h2>
      <p id="prompt-description" class="hint"></p>
      <label for="full-prompt">Text předávaný přes stdin do Codex CLI</label
      ><textarea id="full-prompt" rows="22" readonly></textarea>
    </dialog>
  </body>
</html>
